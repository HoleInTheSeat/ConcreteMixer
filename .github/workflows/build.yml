name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress license:format clean verify

      - uses: actions/upload-artifact@v4
        with:
          name: ConcreteMixer-CraftBukkit-26.3
          path: target/ConcreteMixer-1.2.2-craftbukkit26.3.jar
          if-no-files-found: error
